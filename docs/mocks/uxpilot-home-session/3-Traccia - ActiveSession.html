<!DOCTYPE html>
<html lang="it">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessione - Traccia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#1D1F25',
                            surface: '#252830',
                            elevated: '#2C3038',
                            border: 'rgba(224, 224, 224, 0.12)',
                            accent: '#C7F464',
                            accentSoft: 'rgba(199, 244, 100, 0.12)',
                            accentBorder: 'rgba(199, 244, 100, 0.40)',
                            textHeading: '#E0E0E0',
                            textBody: '#AAAAAA',
                            muted: '#666666',
                        }
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                    borderRadius: {
                        'button': '4px',
                        'card': '12px',
                    },
                    boxShadow: {
                        'premium': 'rgba(0,0,0,0.45) 0 12px 24px -6px, rgba(0,0,0,0.3) 0 4px 8px -2px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1D1F25;
            color: #AAAAAA;
            -webkit-tap-highlight-color: transparent;
        }
        .set-row-active {
            background-color: rgba(199, 244, 100, 0.05);
        }
        .set-completed {
            background-color: rgba(199, 244, 100, 0.15);
            border-color: rgba(199, 244, 100, 0.4);
        }
    </style>
</head>
<body class="font-sans antialiased pb-32">

    <!-- Top Navigation / Progress -->
    <header id="header" class="px-4 py-4 flex flex-col gap-4 sticky top-0 bg-brand-bg z-50">
        <div class="flex justify-between items-center">
            <button class="w-10 h-10 flex items-center justify-center text-brand-textHeading">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="text-center">
                <p class="text-[10px] font-bold uppercase tracking-widest text-brand-muted">SESSIONE IN CORSO</p>
                <h1 class="text-brand-textHeading font-bold">Push Day A</h1>
            </div>
            <div class="w-10 h-10 flex items-center justify-center text-brand-accent font-bold">
                00:42
            </div>
        </div>
        <!-- Simple Progress Bar -->
        <div class="w-full h-1 bg-brand-surface rounded-full overflow-hidden">
            <div class="h-full bg-brand-accent w-1/3"></div>
        </div>
    </header>

    <!-- Rest Timer Bar (Sticky) -->
    <div id="rest-timer" class="mx-4 mb-6 bg-brand-accentSoft border border-brand-accentBorder rounded-lg p-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-hourglass-half text-brand-accent"></i>
            <span class="text-xs font-bold text-brand-accent uppercase tracking-wider">RIPOSO CONSIGLIATO: 01:30</span>
        </div>
        <button class="bg-brand-accent text-[#111111] text-[10px] font-bold px-3 py-1 rounded-sm uppercase">
            AVVIA
        </button>
    </div>

    <!-- Current Exercise -->
    <main class="px-4">
        <div id="exercise-card" class="mb-8">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <p class="text-brand-accent text-[12px] font-bold uppercase tracking-[1px] mb-1">ESERCIZIO 2 DI 6</p>
                    <h2 class="text-brand-textHeading text-2xl font-bold italic">Bench Press (Bilanciere)</h2>
                </div>
                <button class="w-8 h-8 rounded-full bg-brand-surface border border-brand-border flex items-center justify-center text-brand-muted">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>
            </div>

            <!-- Notes/Tips -->
            <div class="bg-brand-surface p-3 rounded-card border border-brand-border mb-6">
                <p class="text-xs text-brand-textBody leading-relaxed">
                    <span class="font-bold text-brand-textHeading">Nota Coach:</span> Focus sulla fase eccentrica lenta (3 secondi). Gomiti a 45 gradi.
                </p>
            </div>

            <!-- Sets Table -->
            <div class="space-y-2">
                <!-- Header -->
                <div class="grid grid-cols-5 text-[10px] font-bold uppercase text-brand-muted px-2">
                    <div class="text-center">SET</div>
                    <div class="col-span-2 text-center">PRECEDENTE</div>
                    <div class="text-center">KG</div>
                    <div class="text-center">REPS</div>
                </div>

                <!-- Set Row 1 -->
                <div class="grid grid-cols-5 items-center bg-brand-surface border border-brand-accentBorder rounded-card p-2 set-completed">
                    <div class="text-center font-bold text-brand-textHeading">1</div>
                    <div class="col-span-2 text-center text-[11px] text-brand-muted">80kg × 8</div>
                    <div class="flex justify-center">
                        <input type="number" value="85" class="w-12 bg-transparent text-center font-bold text-brand-textHeading outline-none border-b border-brand-accent">
                    </div>
                    <div class="flex justify-center">
                        <input type="number" value="8" class="w-12 bg-transparent text-center font-bold text-brand-textHeading outline-none border-b border-brand-accent">
                    </div>
                </div>

                <!-- Set Row 2 (Active) -->
                <div class="grid grid-cols-5 items-center bg-brand-elevated border border-brand-border rounded-card p-2">
                    <div class="text-center font-bold text-brand-textHeading">2</div>
                    <div class="col-span-2 text-center text-[11px] text-brand-muted">80kg × 8</div>
                    <div class="flex justify-center">
                        <input type="number" placeholder="-" class="w-12 bg-transparent text-center font-bold text-brand-textHeading outline-none border-b border-brand-muted">
                    </div>
                    <div class="flex justify-center">
                        <input type="number" placeholder="-" class="w-12 bg-transparent text-center font-bold text-brand-textHeading outline-none border-b border-brand-muted">
                    </div>
                </div>

                <!-- Set Row 3 -->
                <div class="grid grid-cols-5 items-center bg-brand-surface border border-brand-border rounded-card p-2 opacity-60">
                    <div class="text-center font-bold text-brand-textHeading">3</div>
                    <div class="col-span-2 text-center text-[11px] text-brand-muted">80kg × 8</div>
                    <div class="flex justify-center">
                        <input type="number" placeholder="-" class="w-12 bg-transparent text-center font-bold text-brand-textHeading outline-none border-b border-transparent">
                    </div>
                    <div class="flex justify-center">
                        <input type="number" placeholder="-" class="w-12 bg-transparent text-center font-bold text-brand-textHeading outline-none border-b border-transparent">
                    </div>
                </div>

                <button class="w-full py-2 text-brand-muted text-[11px] font-bold uppercase tracking-widest">+ AGGIUNGI SET</button>
            </div>
        </div>

        <!-- Exercise Navigation -->
        <div class="flex justify-between items-center mt-12 pb-8">
            <button class="flex items-center gap-2 text-brand-muted font-bold text-xs">
                <i class="fa-solid fa-chevron-left"></i>
                PRECEDENTE
            </button>
            <button class="flex items-center gap-2 text-brand-accent font-bold text-xs uppercase tracking-wider">
                PROSSIMO
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </main>

    <!-- Bottom Action Bar -->
    <footer class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-brand-bg via-brand-bg to-transparent">
        <button id="finish-btn" class="w-full bg-[#F87171] text-white font-bold py-4 rounded-button shadow-premium flex items-center justify-center gap-2">
            <i class="fa-solid fa-check-double"></i>
            TERMINA ALLENAMENTO
        </button>
    </footer>

</body>
</html>
