services:
  postgres:
    image: postgres:16
    container_name: workout-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workout_planner
    ports:
      - "5432:5432"
    volumes:
      - workout_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  workout_pg_data:
